name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: check / fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (includes rust-embed template lookup)
        run: cargo test --all

      - name: Verify Soroban template compiles
        run: cargo test --manifest-path templates/soroban/Cargo.toml --locked

  python-template:
    name: python MCP template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and lint
        run: |
          python -m pip install flake8 black
          python -m py_compile templates/python-mcp/main.py
          flake8 templates/python-mcp --max-line-length=100 --extend-ignore=E501
          black --check templates/python-mcp

  node-template:
    name: node MCP template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tsc and eslint
        working-directory: templates/node-mcp
        run: |
          npm install
          npx tsc --noEmit
          npx eslint src
