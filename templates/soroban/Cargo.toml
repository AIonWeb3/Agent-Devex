[package]
name = "agent-pay-integration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }
# Keep 2.x in the tree. Host testutils break on dalek 3 (ChaCha20Rng / CryptoRng).
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
