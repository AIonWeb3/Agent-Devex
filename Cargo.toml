[package]
name = "agent-devex"
version = "0.1.0"
edition = "2021"
description = "CLI to scaffold, test, and deploy AI-to-Web3 integrations on Stellar (Soroban + MCP)."
license = "MIT"
readme = "README.md"
default-run = "agent-devex"

[[bin]]
name = "agent-devex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
