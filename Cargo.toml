[package]
name = "agent-devex"
version = "0.1.0"
edition = "2024"
authors = ["AIonWeb3"]
description = "CLI to scaffold, test, and deploy AI-to-Web3 integrations on Stellar (Soroban + MCP)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/AIonWeb3/Agent-Devex"
homepage = "https://github.com/AIonWeb3/Agent-Devex"
keywords = ["stellar", "soroban", "mcp", "ai", "web3"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "cargo"] }
colored = "3"
dialoguer = "0.11"
dotenvy = "0.15"
# Release-build crash reports (installed from the binary entrypoint).
human-panic = { version = "2.0.8" }
serde = "1.0.229"
serde_derive = "1.0.229"
thiserror = "2.0.20"
toml = "0.8.23"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "ansi", "fmt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
